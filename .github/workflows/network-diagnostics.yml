name: Native network diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
          cache: true
      - name: Trace relay recovery and established SSH
        run: go test -race -v ./internal/agent -run 'TestAgentTURNFallbackRotationAndQuota|TestFailedRelayRetriesWithTCP|TestFlowTransportFailureFallsBackToCloudflare|TestEstablishedFlowOutageFallsBackToCloudflare' -count=1
